name: Frontend CI

on:
  push:
    branches:
      - main

jobs:
  frontend-pipeline:
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ Checkout
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Sonar Scan (non-blocking)
      - name: Sonar Scan
        uses: sonarsource/sonarcloud-github-action@v2.3.1
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=frontend-app
            -Dsonar.organization=your-org
            -Dsonar.host.url=https://sonarcloud.io

      - name: Show Sonar URL
        run: echo "Sonar URL: https://sonarcloud.io/dashboard?id=frontend-app"

      # 3️⃣ Maven Build
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Maven Build
        run: mvn clean install

      # 4️⃣ Docker Build
      - name: Docker Build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: demo/frontend-app:latest

      # 5️⃣ Syft Scan
      - name: Syft Scan
        uses: anchore/syft-action@v0.5.0
        continue-on-error: true

      # 6️⃣ Trivy Scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.12.0
        continue-on-error: true

      # 7️⃣ Dummy Image Push
      - name: Image pushed to Artifactory
        run: echo "✅ Frontend image pushed successfully (dummy stage)"
